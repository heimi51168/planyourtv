name: Feature request
description: Suggest a change to the TV app or its local parental controls
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem first, then the smallest change that would solve it. Large features
        and refactors should be discussed before a pull request is opened.

        Remote control is a hosted service; requests about the hosted parent app or server may be
        out of scope for this repository. Local TV behavior is in scope.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Local child mode and rules
        - PIN and parent access
        - Home screen and Home Guard
        - Phone settings page
        - Installation and update
        - Accessibility or language
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, and what is difficult or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what the user should see or do, not only the implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: risks
    attributes:
      label: Risks and permissions
      description: Mention new permissions, network destinations, stored data or ways a child could bypass the change.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This request is for a TV you own or are authorized to manage.
          required: true
        - label: I am not asking the project to download, install or advertise unrelated apps.
          required: true
